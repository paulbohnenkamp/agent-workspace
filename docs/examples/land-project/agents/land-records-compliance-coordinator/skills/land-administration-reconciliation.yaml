instructions: |
  Compare acquisition, title, lease, surface, pooling, division-order, owner,
  and compliance artifacts. Identify mismatched parties, dates, interests,
  statuses, and unacknowledged downstream impacts. Create explicit follow-up
  work instead of silently changing a record.
