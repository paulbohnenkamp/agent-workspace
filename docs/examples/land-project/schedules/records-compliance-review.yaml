kind: schedule
id: records-compliance-review
name: Records and Compliance Review
version: 1.0.0
description: Review records completeness, recording status, exceptions, and audit evidence.
trigger:
  type: cron
  expression: "0 11 * * 5"
  timezone: America/New_York
action:
  type: agent_run
  agent_id: land-records-compliance-coordinator
enabled: true
metadata: {tags: [records, compliance, audit]}
